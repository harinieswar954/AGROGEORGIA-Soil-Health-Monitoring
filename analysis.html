<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AI Analysis</title><link rel="stylesheet" href="/style.css"></head><body>
<nav><div class="brand">AGROGEORGIA</div><div><a href="/">Home</a><a href="/dashboard.html">Dashboard</a><a href="/analysis.html">AI Analysis</a><a href="/history.html">History</a><a href="/research.html">Research Portal</a></div></nav>
<main class="container"><span class="badge">AI ANALYSIS</span><h1>Soil Analysis</h1><p>Enter soil/environmental parameters for crop recommendation.</p>
<div class="form-grid"><label>Moisture (%)<input id="moisture" value="62"></label><label>pH<input id="ph" value="6.7" step="0.1"></label><label>Nitrogen<input id="nitrogen" value="120"></label><label>Phosphorus<input id="phosphorus" value="45"></label><label>Potassium<input id="potassium" value="80"></label><label>Temperature<input id="temperature" value="28"></label><label>Humidity<input id="humidity" value="65"></label><label>Rainfall<input id="rainfall" value="120"></label></div>
<button class="btn" onclick="analyze()">Analyze Soil</button><button class="btn secondary" onclick="example()">Load Example</button>
<section class="result"><h2>Prediction Result</h2><div class="result-grid"><div><small>Soil Type</small><b id="soilType">--</b></div><div><small>Suitable Plant</small><b id="plant">--</b></div><div><small>Growth Duration</small><b id="duration">--</b></div><div><small>Soil Health</small><b id="health">--</b></div></div><p id="status" class="note"></p></section>
<button class="btn" onclick="save()">Save Reading to Database</button><p id="saveStatus" class="status"></p></main>
<script>
function q(){return new URLSearchParams({moisture:moisture.value,ph:ph.value,nitrogen:nitrogen.value,phosphorus:phosphorus.value,potassium:potassium.value,temperature:temperature.value,humidity:humidity.value,rainfall:rainfall.value})}
async function analyze(){let d=await(await fetch("/api/predict?"+q())).json();soilType.textContent=d.soilType;plant.textContent=d.suitablePlant;duration.textContent=d.growthDuration;health.textContent=d.soilHealth;status.textContent="Prediction source: "+d.modelStatus}
async function save(){let x=q();x.append("source","demo");let d=await(await fetch("/api/readings?"+x)).json();saveStatus.textContent=d.message||"Reading saved."}
function example(){moisture.value=70;ph.value=6.5;nitrogen.value=90;phosphorus.value=45;potassium.value=50;temperature.value=27;humidity.value=80;rainfall.value=220;analyze()} analyze();
</script></body></html>
