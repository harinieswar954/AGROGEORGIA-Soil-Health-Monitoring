
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Analyze soil parameters and get AI-powered crop recommendations using AGROGEORGIA.">
    <title>AI Analysis | AGROGEORGIA</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<nav aria-label="Main navigation">
    <div class="brand">AGROGEORGIA</div>
    <div>
        <a href="/">Home</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/analysis.html" aria-current="page">AI Analysis</a>
        <a href="/history.html">History</a>
        <a href="/research.html">Research Portal</a>
    </div>
</nav>

<main class="container">

    <span class="badge">AI ANALYSIS</span>

    <h1>Soil Analysis</h1>

    <p>Enter soil and environmental parameters for crop recommendation.</p>

    <div class="form-grid">

        <label for="moisture">Moisture (%)
            <input type="number" id="moisture" min="0" max="100" step="any" value="62" required>
        </label>

        <label for="ph">pH
            <input type="number" id="ph" min="0" max="14" step="0.1" value="6.7" required>
        </label>

        <label for="nitrogen">Nitrogen
            <input type="number" id="nitrogen" min="0" step="any" value="120" required>
        </label>

        <label for="phosphorus">Phosphorus
            <input type="number" id="phosphorus" min="0" step="any" value="45" required>
        </label>

        <label for="potassium">Potassium
            <input type="number" id="potassium" min="0" step="any" value="80" required>
        </label>

        <label for="temperature">Temperature (°C)
            <input type="number" id="temperature" min="-50" max="60" step="any" value="28" required>
        </label>

        <label for="humidity">Humidity (%)
            <input type="number" id="humidity" min="0" max="100" step="any" value="65" required>
        </label>

        <label for="rainfall">Rainfall (mm)
            <input type="number" id="rainfall" min="0" step="any" value="120" required>
        </label>

    </div>

    <button class="btn" type="button" onclick="analyze()">Analyze Soil</button>

    <button class="btn secondary" type="button" onclick="example()">Load Example</button>

    <section class="result" aria-labelledby="resultHeading">

        <h2 id="resultHeading">Prediction Result</h2>

        <div class="result-grid">

            <div>
                <small>Soil Type</small>
                <b id="soilType">--</b>
            </div>

            <div>
                <small>Suitable Plant</small>
                <b id="plant">--</b>
            </div>

            <div>
                <small>Growth Duration</small>
                <b id="duration">--</b>
            </div>

            <div>
                <small>Soil Health</small>
                <b id="health">--</b>
            </div>

        </div>

        <p id="status" class="note" role="status" aria-live="polite"></p>

    </section>

    <button class="btn" type="button" onclick="save()">Save Reading to Database</button>

    <p id="saveStatus" class="status" role="status" aria-live="polite"></p>

</main>

<script>

const fields = [
    "moisture",
    "ph",
    "nitrogen",
    "phosphorus",
    "potassium",
    "temperature",
    "humidity",
    "rainfall"
];

function getField(id) {
    return document.getElementById(id);
}

function validateInputs() {

    for (const id of fields) {

        const input = getField(id);

        if (input.value.trim() === "" || !input.checkValidity()) {
            input.reportValidity();
            input.focus();
            return false;
        }
    }

    return true;
}

function q() {

    const params = new URLSearchParams();

    for (const id of fields) {
        params.append(id, getField(id).value);
    }

    return params;
}

async function analyze() {

    if (!validateInputs()) {
        return;
    }

    const status = getField("status");
    status.textContent = "Analyzing soil parameters...";

    try {

        const response = await fetch("/api/predict?" + q());

        if (!response.ok) {
            throw new Error("Prediction service is unavailable.");
        }

        const data = await response.json();

        getField("soilType").textContent = data.soilType || "--";
        getField("plant").textContent = data.suitablePlant || "--";
        getField("duration").textContent = data.growthDuration || "--";
        getField("health").textContent = data.soilHealth || "--";

        status.textContent =
            "Prediction source: " + (data.modelStatus || "Not specified");

    } catch (error) {

        status.textContent = "Unable to generate prediction. Please try again.";

        console.error("Prediction error:", error);
    }
}

async function save() {

    if (!validateInputs()) {
        return;
    }

    const saveStatus = getField("saveStatus");

    saveStatus.textContent = "Saving reading...";

    try {

        const params = q();
        params.append("source", "demo");

        const response = await fetch("/api/readings?" + params);

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Unable to save reading.");
        }

        saveStatus.textContent = data.message || "Reading saved successfully.";

    } catch (error) {

        saveStatus.textContent =
            error.message || "Unable to save reading. Please try again.";

        console.error("Database error:", error);
    }
}

function example() {

    getField("moisture").value = 70;
    getField("ph").value = 6.5;
    getField("nitrogen").value = 90;
    getField("phosphorus").value = 45;
    getField("potassium").value = 50;
    getField("temperature").value = 27;
    getField("humidity").value = 80;
    getField("rainfall").value = 220;

    analyze();
}

analyze();

</script>

</body>
</html>
